<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Layout template com Grid</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f5f5; font-family: Arial; }
.grade { width: min(600px, 95vw); height: 430px; display: grid; gap: 5px; grid-template-columns: 1fr 1.7fr 1fr; grid-template-rows: .7fr 1.2fr 1.2fr .7fr; grid-template-areas: "um um um" "dois tres quatro" "cinco tres seis" "cinco sete sete"; }
.item { border-radius: 6px; display: grid; place-items: center; font-size: 24px; font-weight: bold; background: #ffda80; }
.um { grid-area: um; } .dois { grid-area: dois; background: #ef4264; } .tres { grid-area: tres; } .quatro { grid-area: quatro; background: #ef4264; } .cinco { grid-area: cinco; } .seis { grid-area: seis; background: #ef4264; } .sete { grid-area: sete; }
</style></head>
<body><main class="grade"><div class="item um">1</div><div class="item dois">2</div><div class="item tres">3</div><div class="item quatro">4</div><div class="item cinco">5</div><div class="item seis">6</div><div class="item sete">7</div></main></body></html>
