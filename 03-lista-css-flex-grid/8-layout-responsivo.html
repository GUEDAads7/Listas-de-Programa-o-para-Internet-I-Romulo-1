<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Layout responsivo — Atividade 8</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; font-family: Arial; background: #eee; }
.galeria { max-width: 1100px; margin: auto; display: grid; gap: 12px; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 150px; }
.bloco { background: #b9c9a0; border: 5px solid white; box-shadow: 0 2px 6px #aaa; }
.bloco:nth-child(3n) { background: #efa83b; }
.bloco:nth-child(3n + 1) { background: #e9a69b; }
.bloco:nth-child(1), .bloco:nth-child(6) { grid-column: span 2; }
.bloco:nth-child(4) { grid-row: span 2; }
@media screen and (max-width: 500px) {
    .galeria { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 120px; }
    .bloco:nth-child(1), .bloco:nth-child(6) { grid-column: span 2; }
    .bloco:nth-child(4) { grid-row: span 1; }
}
</style></head>
<body><main class="galeria"><div class="bloco"></div><div class="bloco"></div><div class="bloco"></div><div class="bloco"></div><div class="bloco"></div><div class="bloco"></div><div class="bloco"></div><div class="bloco"></div><div class="bloco"></div></main></body></html>
