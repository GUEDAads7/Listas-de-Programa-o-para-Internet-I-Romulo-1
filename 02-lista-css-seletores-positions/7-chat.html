<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat com CSS</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: #f1f1f1; font-family: Arial, sans-serif; }
.chat { width: 360px; height: 560px; padding: 10px; border: 1px solid #bbb; border-radius: 8px; background: white; display: flex; flex-direction: column; gap: 10px; }
.mensagens { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.mensagem { max-width: 90%; padding: 12px; border: 1px solid #ddd; border-radius: 9px; position: relative; }
.recebida { align-self: flex-start; background: #fff; }
.enviada { align-self: flex-end; background: #d2f8d5; }
.hora { display: block; text-align: right; color: #888; font-size: 10px; margin-top: 5px; }
.compor { display: flex; flex-direction: column; gap: 5px; }
textarea { resize: none; min-height: 75px; padding: 10px; }
button { align-self: flex-end; }
</style>
</head>
<body>
<section class="chat">
    <div class="mensagens">
        <div class="mensagem recebida">Olá, tudo bem?<span class="hora">00:50</span></div>
        <div class="mensagem enviada">Estou bem sim, e você? <span class="hora">00:55</span></div>
        <div class="mensagem recebida">Vamos sair hoje? Sabe conversar e Lorem ipsum dolor sit amet consectetur adipisicing elit.<span class="hora">01:01</span></div>
        <div class="mensagem enviada">Criatura..... <span class="hora">00:55</span></div>
    </div>
    <form class="compor" onsubmit="event.preventDefault(); alert('Mensagem demonstrativa!');">
        <textarea placeholder="Digite sua mensagem"></textarea>
        <button type="submit">Enviar</button>
    </form>
</section>
</body>
</html>
