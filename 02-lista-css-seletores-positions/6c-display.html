<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Display 6C</title>
<style>
body { margin: 0; min-height: 100vh; position: relative; }
.quadrado { position: absolute; width: 55px; height: 55px; }
.vermelho { top: 20px; left: 20px; background: red; }
.amarelo { top: 20px; right: 20px; background: yellow; }
.azul { bottom: 20px; left: 20px; background: blue; }
.verde { bottom: 20px; right: 20px; background: green; }
.roxo { top: 45%; left: 45%; background: magenta; }
</style></head><body>
<div class="quadrado vermelho"></div><div class="quadrado amarelo"></div><div class="quadrado azul"></div><div class="quadrado verde"></div><div class="quadrado roxo"></div>
</body></html>
