<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Exemplo especificidade de seletores</title>
<style>
    /* R1 */ li { color: red; }
    /* R2 */ .churras { color: green; }
    /* R3 */ .fruta { color: gray; }
    /* R4 */ li + li.churras { color: black; }
    /* R5 */ .churras[draggable="true"] { color: magenta; }
    /* R6 */ #lip1, #lip2, #lip3 { color: blue; }
    /* R7 */ #lip3.fruta { color: orange; }
    /* R8 */ ol > li.churras#lip5 { color: purple; }
</style>
</head>
<body>
    <h1>Especificidade de seletores</h1>
    <ol>
        <!-- i1 --> <li id="lip0">Abacaxi</li>
        <!-- i2 --> <li class="fruta">Melão</li>
        <!-- i3 --> <li id="lip2" class="fruta">Pera</li>
        <!-- i4 --> <li id="lip3" class="fruta">Uva</li>
        <!-- i5 --> <li id="lip4" class="fruta">Maçã</li>
        <!-- i6 --> <li class="churras">Carne</li>
        <!-- i7 --> <li class="churras">Linguiça</li>
        <!-- i8 --> <li id="lip7" class="churras" draggable="true">Pão de alho</li>
    </ol>
    <p>A cor final depende da correspondência dos seletores, da especificidade e da ordem das regras.</p>
</body>
</html>
