<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Display 6A</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; }
.container { display: flex; flex-direction: column; height: 100vh; }
.item { flex: 1; display: grid; place-items: center; font-size: 2rem; }
.item:nth-child(1) { background: #6500ed; }
.item:nth-child(2) { background: green; }
.item:nth-child(3) { background: red; }
.item:nth-child(4) { background: #edff00; }
</style></head><body><main class="container"><div class="item">1</div><div class="item">2</div><div class="item">3</div><div class="item">4</div></main></body></html>
