<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Atividade 1 — Regra CSS</title>
<style>
    p { color: darkblue; font-size: 20px; }
</style>
</head>
<body>
    <h1>O que é uma regra CSS?</h1>
    <p>Uma regra CSS define como os elementos HTML serão apresentados. Ela é formada por um seletor e por declarações compostas de propriedade e valor.</p>
    <p>Exemplo: o seletor p seleciona os parágrafos, color é a propriedade e darkblue é o valor.</p>
</body>
</html>
