<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Atividade 2 — Estilos nos parágrafos</title>
<style>
    .p1 { color: #c0392b; font-family: Arial, sans-serif; }
    .p2 { color: #176b45; font-family: Georgia, serif; }
    .p3 { color: #34495e; font-family: "Courier New", monospace; }
    .p4 { color: #8e44ad; font-family: Verdana, sans-serif; }
    .destaque1 { background: #ffeaa7; font-weight: bold; }
    .destaque2 { color: #e84393; text-decoration: underline; }
</style>
</head>
<body>
    <h1>Parágrafos com CSS</h1>
    <p class="p1">Lorem ipsum dolor sit amet, <span class="destaque1">consectetur</span> adipiscing elit. Integer vitae justo.</p>
    <p class="p2">Lorem ipsum dolor sit amet, <span class="destaque2">adipiscing</span> elit. Sed posuere, neque vel.</p>
    <p class="p3">Lorem ipsum dolor sit amet, <span class="destaque1">tempor</span> incididunt ut labore et dolore.</p>
    <p class="p4">Lorem ipsum dolor sit amet, <span class="destaque2">aliqua</span>. Ut enim ad minim veniam.</p>
</body>
</html>
