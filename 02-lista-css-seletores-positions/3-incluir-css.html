<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Atividade 3 — Como incluir CSS</title>
<link rel="stylesheet" href="estilo.css">
<style>
    h1 { color: navy; }
</style>
</head>
<body>
    <h1>Formas de incluir CSS</h1>
    <p style="color: darkgreen;">CSS inline: aplicado diretamente no atributo style do elemento.</p>
    <p>CSS interno: escrito dentro da tag style no head do documento.</p>
    <p>CSS externo: escrito em um arquivo .css e associado com link rel="stylesheet".</p>
</body>
</html>
