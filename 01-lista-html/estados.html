<body>
    <h1>Estados HTTP</h1>
    <p>Os códigos de status indicam o resultado de uma requisição HTTP.</p>
    <ul>
        <li>2xx — sucesso.</li>
        <li>3xx — redirecionamento.</li>
        <li>4xx — erro na requisição ou no acesso do cliente.</li>
        <li>5xx — erro no servidor.</li>
    </ul>
