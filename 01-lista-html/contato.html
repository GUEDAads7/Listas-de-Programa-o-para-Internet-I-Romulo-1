<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contato</title></head>
<body>
    <h1>Entre em contato</h1>
    <p>Preencha os campos abaixo. Os dados serão utilizados apenas para demonstrar a estrutura de um formulário HTML.</p>
    <form action="#" method="post">
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required><br><br>
        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" placeholder="seu@email.com" required><br><br>
        <label for="assunto">Assunto:</label><br>
        <input type="text" id="assunto" name="assunto" placeholder="Assunto da mensagem"><br><br>
        <label for="estado">Estado:</label><br>
        <select id="estado" name="estado">
            <option value="">Selecione</option>
            <option value="SC">Santa Catarina</option><option value="PR">Paraná</option><option value="RS">Rio Grande do Sul</option>
            <option value="SP">São Paulo</option><option value="RJ">Rio de Janeiro</option><option value="MG">Minas Gerais</option>
        </select><br><br>
        <label for="mensagem">Mensagem:</label><br>
        <textarea id="mensagem" name="mensagem" placeholder="Digite sua mensagem" rows="6" required></textarea><br><br>
        <button type="submit">Enviar</button>
    </form>
    <p><a href="curriculo.html">Voltar para o currículo</a></p>
</body>
</html>
